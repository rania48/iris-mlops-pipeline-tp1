name: MLOps CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-mlops-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train model
        run: python src/train.py

      - name: Run prediction
        run: python src/predict.py

      - name: Run prediction from Model Registry
        run: python src/predict_registry.py

      - name: Check data drift
        run: python src/drift.py

      - name: Run tests
        run: pytest

      - name: Build Docker image
        run: docker build -t mlops-tp2:1.0 .

      - name: Test Docker API
        run: |
          docker run -d --name mlops-tp2 -p 5000:5000 mlops-tp2:1.0
          curl --retry 10 --retry-delay 2 --retry-connrefused --fail http://127.0.0.1:5000/health
          curl --fail -X POST http://127.0.0.1:5000/predict \
            -H "Content-Type: application/json" \
            -d '{"features": [5.1, 3.5, 1.4, 0.2]}'
